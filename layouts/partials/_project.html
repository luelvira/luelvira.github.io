<div class="projects-card sticky {{ range .Params.Categories }} {{ lower . }} {{ end }}">
  <div class="sticky-content">
    <div class="sticky-content--wrap">
    <time class="projects-card__timestamp" target="_blank">{{ .Date | time.Format ":date_medium" }}</time>
    <h2> <a href="{{ (index .Pages 0).Permalink }}" >{{ .Title }}</a></h2>
    <p class="projects-card__description"> {{ .Page.Description }}</p>
    {{ if .Params.Source }}
    <div class="mark"><a href="{{ .Params.Source }}" target="_blank">View Code</a></div>
    {{ end }}
    </div>
    </div>
  </div>
