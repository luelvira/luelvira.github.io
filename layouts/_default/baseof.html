{{ $data := or (index .Site.Data .Site.Language.Lang).content .Site.Data.content }}
<!DOCTYPE html>
<html lang="{{ $data.Language }}">

<body class="body">
  {{ partial "nav.html" . }}

  {{ partial "header.html" $data }}

{{ partial "scripts.html" }}
</body>
</html>
