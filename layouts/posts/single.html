{{ define "main" }}
{{ partial "breadcrumbs.html" (dict "single" true "context" .) }}
<main class="wrap {{ .Page.Type }} single">
    <h1>{{ .Title }}</h1>
    <section class="content">
    {{ .Content }}
    </section>

   <section class="toc"> 
     <div class="toc-wrap">
     <h5>{{ i18n "toc_heading" }}</h5>
     {{ .TableOfContents }}
     </div>
   </section> 
</main>
{{ end }}
